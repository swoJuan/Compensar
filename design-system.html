<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Compensar — Design System</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/core.css?v=20260507-8">
  <link rel="stylesheet" href="css/portal.css?v=20260507-8">
  <link rel="stylesheet" href="icons/icons.css">

  <!-- Shell-specific styles -->
  <style>
    /* ──────────────────────────────────────────────────────────── */
    /* SHELL LAYOUT                                                 */
    /* ──────────────────────────────────────────────────────────── */
    
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      font-family: var(--font-body);
      background: var(--ui-bg);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ──────────────────────────────────────────────────────────── */
    /* HEADER                                                       */
    /* ──────────────────────────────────────────────────────────── */
    
    header {
      background: var(--ui-surface);
      border-bottom: 1px solid var(--ui-border);
      padding: var(--space-12) var(--space-16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-16);
      z-index: 100;
      box-shadow: 0 1px 3px color-mix(in srgb, var(--ui-text) 8%, transparent);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: var(--space-8);
      font-weight: 700;
      font-size: 16px;
      color: var(--ui-text);
      text-decoration: none;
    }

    .header-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--base-brand-80), var(--base-brand-90));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }

    .header-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .header-title-main {
      font-size: 14px;
      font-weight: 700;
      color: var(--ui-text);
    }

    .header-title-sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--ui-text-muted);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: var(--space-12);
      margin-left: auto;
    }

    .theme-switcher {
      display: flex;
      gap: 4px;
      background: var(--ui-bg);
      border-radius: var(--radius-xs);
      padding: 4px;
    }

    .theme-switcher button {
      padding: 6px 12px;
      border: none;
      background: transparent;
      color: var(--ui-text-muted);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .theme-switcher button:hover {
      background: var(--ui-border);
      color: var(--ui-text);
    }

    .theme-switcher button.active {
      background: var(--color-primary);
      color: white;
    }

    /* ──────────────────────────────────────────────────────────── */
    /* SIDEBAR                                                      */
    /* ──────────────────────────────────────────────────────────── */
    
    aside {
      width: 280px;
      min-width: 280px;
      background: var(--ui-bg);
      border-right: 1px solid var(--ui-border);
      overflow-y: auto;
      overflow-x: hidden;
      padding: var(--space-12) 0;
      flex-shrink: 0;
      /* Garantiza que el aside tenga altura acotada para poder hacer scroll */
      align-self: stretch;
      height: 0;
      min-height: 100%;
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: var(--space-8) 0;
      border-bottom: 1px solid var(--ui-border);
    }

    .nav-section:last-child {
      border-bottom: none;
    }

    .nav-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      padding: var(--space-8) var(--space-16);
      color: var(--ui-text-muted);
      letter-spacing: 0.05em;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-8);
      padding: var(--space-8) var(--space-16);
      color: var(--ui-text-secondary);
      cursor: pointer;
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: all 0.15s ease;
      font-size: 13px;
    }

    .nav-item:hover {
      background: var(--ui-border);
      color: var(--ui-text);
    }

    .nav-item.active {
      background: color-mix(in srgb, var(--color-primary) 10%, transparent);
      border-left-color: var(--color-primary);
      color: var(--color-primary);
      font-weight: 500;
    }

    .nav-item .icon {
      font-size: 18px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ──────────────────────────────────────────────────────────── */
    /* MAIN CONTENT                                                 */
    /* ──────────────────────────────────────────────────────────── */
    
    #main-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-24);
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .section-header {
      margin-bottom: var(--space-32);
    }

    .section-header h1 {
      font-size: var(--font-size-2xl);
      font-weight: 700;
      color: var(--ui-text);
      margin: 0 0 var(--space-4) 0;
    }

    .section-header > p {
      color: var(--ui-text-secondary);
      font-size: var(--font-size-sm);
      margin: 0;
    }

    /* ──────────────────────────────────────────────────────────── */
    /* TOAST                                                        */
    /* ──────────────────────────────────────────────────────────── */
    
    #toast {
      position: fixed;
      bottom: var(--space-16);
      right: var(--space-16);
      background: var(--ui-text);
      color: var(--ui-bg);
      padding: var(--space-12) var(--space-16);
      border-radius: var(--radius-xs);
      font-size: var(--font-size-sm);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 1000;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* ──────────────────────────────────────────────────────────── */
    /* RESPONSIVE                                                   */
    /* ──────────────────────────────────────────────────────────── */
    
    @media (max-width: 768px) {
      aside {
        display: none;
      }

      header {
        padding: var(--space-8) var(--space-12);
        gap: var(--space-8);
      }

      .header-title-main {
        font-size: 13px;
      }

      .header-title-sub {
        display: none;
      }

      #main-content {
        padding: var(--space-16);
      }

      .section-header h1 {
        font-size: var(--font-size-xl);
      }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <a href="/" class="header-brand">
    <div class="header-logo">C</div>
    <div class="header-title">
      <div class="header-title-main">Compensar</div>
      <div class="header-title-sub">Design System v2.1</div>
    </div>
  </a>

  <div class="header-controls">
    <div class="theme-switcher">
      <button data-theme-btn="light" onclick="theme.set('light')" title="Light">☀</button>
      <button data-theme-btn="dark" onclick="theme.set('dark')" title="Dark">🌙</button>
      <button data-theme-btn="high-contrast" onclick="theme.set('high-contrast')" title="High Contrast">◑</button>
    </div>
  </div>
</header>

<!-- MAIN LAYOUT -->
<main>
  <!-- SIDEBAR NAVIGATION -->
  <aside id="sidebar">
    <!-- Populated by JavaScript -->
  </aside>

  <!-- MAIN CONTENT -->
  <div id="main-content">
    <!-- Docs loaded here by router -->
  </div>
</main>

<!-- TOAST -->
<div id="toast"></div>

<!-- SCRIPTS -->
<script src="js/router.js?v=20260507-5"></script>
<script src="js/theme.js"></script>
<script src="js/code-copy.js"></script>
<script src="js/component-docs.js?v=20260505-2"></script>
<script src="js/selection-docs.js?v=20260504-1"></script>
<script src="js/alert-docs.js?v=20260505-3"></script>
<script src="js/toast-docs.js?v=20260504-1"></script>
<script src="js/modal-docs.js?v=20260507-3"></script>
<script src="js/dropdown-docs.js?v=20260504-5"></script>
<script src="js/badges-docs.js?v=20260506-8"></script>
<script src="js/cards-docs.js?v=20260505-2"></script>
<script src="js/pagination-docs.js?v=20260506-2"></script>
<script src="js/tables-docs.js?v=20260506-1"></script>
<script src="js/tabs-docs.js?v=20260506-1"></script>
<script src="js/empty-state-docs.js?v=20260506-1"></script>
<script src="js/loading-docs.js?v=20260506-2"></script>
<script src="js/breadcrumb-docs.js?v=20260506-3"></script>
<script src="js/accordion-docs.js?v=20260507-1"></script>
<script src="js/app-tabs-docs.js?v=20260506-1"></script>
<script src="js/app-header-docs.js?v=20260507-1"></script>
<script src="js/app-bottom-sheet-docs.js?v=20260507-1"></script>

<script>
  /**
   * Initialize Design System Shell
   */
  document.addEventListener('DOMContentLoaded', () => {
    // Initialize theme
    theme.init();

    // Render navigation
    const sidebar = document.getElementById('sidebar');
    const navMap = router.getNav();

    // ── Rutas garantizadas (cache-safe) ────────────────────
    // Estas entradas se inyectan siempre, independiente de la
    // versión cacheada de router.js en el navegador.
    const GUARANTEED_ROUTES = {
      'demo/core': {
        label: 'Demo core',
        path: 'demo/core.html',
        icon: 'category',
        group: 'inicio'
      },
      'web/componentes/accordion': {
        label: 'Accordion',
        path: 'transversales/components/accordion.html',
        icon: 'list_alt',
        group: 'web-componentes'
      },
      'app/componentes/accordion': {
        label: 'Accordion',
        path: 'transversales/components/accordion.html',
        icon: 'list_alt',
        group: 'app'
      },
      'web/componentes/badges': {
        label: 'Chips / Tags / Badges',
        path: 'transversales/components/badges.html',
        icon: 'award_star',
        group: 'web-componentes'
      },
      'app/componentes/badges': {
        label: 'Chips / Tags / Badges',
        path: 'transversales/components/badges.html',
        icon: 'award_star',
        group: 'app'
      },
      'app/componentes/bottom-sheet': {
        label: 'Bottom Sheet',
        path: 'app/components/bottom-sheet.html',
        icon: 'bottom_panel_open',
        group: 'app'
      },
      'app/componentes/dropdown': {
        label: 'Dropdown / Select App',
        path: 'app/components/dropdown.html',
        icon: 'arrow_drop_down_circle',
        group: 'app'
      },
      'app/componentes/header': {
        label: 'Header App',
        path: 'app/components/header.html',
        icon: 'web_asset',
        group: 'app'
      },
      'app/componentes/loading': {
        label: 'Loading',
        path: 'transversales/components/loading.html',
        icon: 'progress_activity',
        group: 'app'
      },
      'guidelines/high-contrast': {
        label: 'High Contrast',
        path: 'guidelines/high-contrast.html',
        icon: 'eye',
        group: 'guidelines'
      }
    };
    Object.entries(GUARANTEED_ROUTES).forEach(([id, def]) => {
      if (!navMap[id]) navMap[id] = def;
    });

    // ── Función de navegación con fallback directo ──────────
    function navigateTo(id) {
      // Si el router conoce la ruta, lo maneja él
      if (router.navigate(id) !== false) return;
      // Fallback: fetch directo para rutas no en router cacheado
      const def = navMap[id];
      if (!def) return;
      fetch(`/docs/${def.path}?v=${Date.now()}`)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(html => {
          const container = document.querySelector('#main-content');
          if (container) container.innerHTML = html;
          history.replaceState(null, '', `#${id}`);
          document.querySelectorAll('[data-nav-item]').forEach(el =>
            el.classList.toggle('active', el.getAttribute('data-nav-item') === id)
          );
        })
        .catch(err => console.warn('Navigate fallback error:', err));
    }

    const NAV_ICON_MAP = {
      home: 'house',
      stars: 'star',
      palette: 'palette',
      phone_iphone: 'device-mobile',
      title: 'text-t',
      space_bar: 'ruler',
      view_quilt: 'squares-four',
      layers: 'stack',
      rounded_corner: 'corners-in',
      smart_button: 'cursor',
      input: 'article',
      arrow_drop_down_circle: 'caret-circle-down',
      check_box: 'check-square',
      notification_important: 'warning-circle',
      notifications: 'bell',
      web_asset: 'browser',
      credit_card: 'credit-card',
      list_numbers: 'number-circle-one',
      award_star: 'medal',
      interests: 'squares-four',
      category: 'grid-four',
      hub: 'share-network',
      table_chart: 'table',
      text_fields: 'ruler',
      fact_check: 'check-square',
      inbox: 'package',
      progress_activity: 'spinner',
      list_alt: 'rows',
      route: 'caret-right',
      eye: 'eye',
      book_open: 'book-open'
    };
    
    const navGroups = [
      { id: 'inicio', label: 'Inicio' },
      { id: 'fundamentos', label: 'Fundamentos' },
      { id: 'app', label: 'App' },
      { id: 'app-fundamentos', label: 'App · Fundamentos' },
      { id: 'web-componentes', label: 'Web · Componentes' },
      { id: 'web-iconos', label: 'Web · Iconos' },
      { id: 'tokens', label: 'Tokens semánticos' },
      { id: 'guidelines', label: 'Guidelines' },
      { id: 'qa', label: 'QA' }
    ];

    console.log('[Nav] navMap keys:', Object.keys(navMap).join(', '));
    navGroups.forEach((group) => {
      const entries = Object.entries(navMap)
        .filter(([, def]) => def.group === group.id)
        .sort(([idA, defA], [idB, defB]) => {
          if (group.id === 'app') {
            if (idA === 'app/intro') return -1;
            if (idB === 'app/intro') return 1;
          }
          return defA.label.localeCompare(defB.label, 'es', { sensitivity: 'base' });
        });
      console.log('[Nav] group:', group.id, '→', entries.length, 'entries');
      if (!entries.length) return;

      const section = document.createElement('nav');
      section.className = 'nav-section';
      section.setAttribute('aria-label', group.label);

      const title = document.createElement('div');
      title.className = 'nav-section-label';
      title.textContent = group.label;
      section.appendChild(title);

      entries.forEach(([id, def]) => {
        const link = document.createElement('a');
        link.className = 'nav-item';
        link.href = `#${id}`;
        link.setAttribute('data-nav-item', id);
        link.onclick = (e) => {
          e.preventDefault();
          navigateTo(id);
        };

        const icon = document.createElement('i');
        icon.className = `icon icon-${NAV_ICON_MAP[def.icon] || 'question'} icon-20`;
        icon.setAttribute('aria-hidden', 'true');

        const label = document.createElement('span');
        label.textContent = def.label;

        link.appendChild(icon);
        link.appendChild(label);
        section.appendChild(link);
      });

      sidebar.appendChild(section);
    });

    // Initialize router and load initial page
    router.init();

    // Make navigateTo available globally for hash changes
    window._navigateTo = navigateTo;
  });

  /**
   * Make functions available for onclick handlers
   */
  window.setTheme = (t) => theme.set(t);
  window.switchTab = (btn, id) => codeCopy.switchTab(btn, id);
  window.copyCode = (btn) => codeCopy.copy(btn);
  window.copyToken = (text, label) => codeCopy.copyToken(text, label);
</script>

</body>
</html>
