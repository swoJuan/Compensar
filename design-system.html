<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <title>Compensar — Design System</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/portal.css">

  <!-- Shell-specific styles -->
  <style>
    /* ──────────────────────────────────────────────────────────── */
    /* SHELL LAYOUT                                                 */
    /* ──────────────────────────────────────────────────────────── */
    
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      font-family: var(--font-body);
      background: var(--ui-bg);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ──────────────────────────────────────────────────────────── */
    /* HEADER                                                       */
    /* ──────────────────────────────────────────────────────────── */
    
    header {
      background: $use-surface-theme-gray-5;
      border-bottom: 1px solid var(--ui-border);
      padding: var(--space-12) var(--space-16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-16);
      z-index: 100;
      box-shadow: 0 1px 3px color-mix(in srgb, var(--ui-text) 8%, transparent);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: var(--space-8);
      font-weight: 700;
      font-size: 16px;
      color: var(--ui-text);
      text-decoration: none;
    }

    .header-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--base-brand-80), var(--base-brand-90));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }

    .header-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .header-title-main {
      font-size: 14px;
      font-weight: 700;
      color: var(--ui-text);
    }

    .header-title-sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--ui-text-muted);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: var(--space-12);
      margin-left: auto;
    }

    .theme-switcher {
      display: flex;
      gap: 4px;
      background: var(--ui-bg);
      border-radius: var(--radius-xs);
      padding: 4px;
    }

    .theme-switcher button {
      padding: 6px 12px;
      border: none;
      background: transparent;
      color: var(--ui-text-muted);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .theme-switcher button:hover {
      background: var(--ui-border);
      color: var(--ui-text);
    }

    .theme-switcher button.active {
      background: var(--color-primary);
      color: white;
    }

    /* ──────────────────────────────────────────────────────────── */
    /* SIDEBAR                                                      */
    /* ──────────────────────────────────────────────────────────── */
    
    aside {
      width: 280px;
      background: var(--ui-bg);
      border-right: 1px solid var(--ui-border);
      overflow-y: auto;
      padding: var(--space-12) 0;
      flex-shrink: 0;
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: var(--space-8) 0;
      border-bottom: 1px solid var(--ui-border);
    }

    .nav-section:last-child {
      border-bottom: none;
    }

    .nav-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      padding: var(--space-8) var(--space-16);
      color: var(--ui-text-muted);
      letter-spacing: 0.05em;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-8);
      padding: var(--space-8) var(--space-16);
      color: var(--ui-text-secondary);
      cursor: pointer;
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: all 0.15s ease;
      font-size: 13px;
    }

    .nav-item:hover {
      background: var(--ui-border);
      color: var(--ui-text);
    }

    .nav-item.active {
      background: color-mix(in srgb, var(--color-primary) 10%, transparent);
      border-left-color: var(--color-primary);
      color: var(--color-primary);
      font-weight: 500;
    }

    .nav-item .icon {
      font-size: 18px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ──────────────────────────────────────────────────────────── */
    /* MAIN CONTENT                                                 */
    /* ──────────────────────────────────────────────────────────── */
    
    #main-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-24);
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .section-header {
      margin-bottom: var(--space-32);
    }

    .section-header h1 {
      font-size: var(--font-size-2xl);
      font-weight: 700;
      color: var(--ui-text);
      margin: 0 0 var(--space-4) 0;
    }

    .section-header > p {
      color: var(--ui-text-secondary);
      font-size: var(--font-size-sm);
      margin: 0;
    }

    /* ──────────────────────────────────────────────────────────── */
    /* TOAST                                                        */
    /* ──────────────────────────────────────────────────────────── */
    
    #toast {
      position: fixed;
      bottom: var(--space-16);
      right: var(--space-16);
      background: var(--ui-text);
      color: var(--ui-bg);
      padding: var(--space-12) var(--space-16);
      border-radius: var(--radius-xs);
      font-size: var(--font-size-sm);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 1000;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* ──────────────────────────────────────────────────────────── */
    /* RESPONSIVE                                                   */
    /* ──────────────────────────────────────────────────────────── */
    
    @media (max-width: 768px) {
      aside {
        display: none;
      }

      header {
        padding: var(--space-8) var(--space-12);
        gap: var(--space-8);
      }

      .header-title-main {
        font-size: 13px;
      }

      .header-title-sub {
        display: none;
      }

      #main-content {
        padding: var(--space-16);
      }

      .section-header h1 {
        font-size: var(--font-size-xl);
      }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <a href="/" class="header-brand">
    <div class="header-logo">C</div>
    <div class="header-title">
      <div class="header-title-main">Compensar</div>
      <div class="header-title-sub">Design System v2.1</div>
    </div>
  </a>

  <div class="header-controls">
    <div class="theme-switcher">
      <button data-theme-btn="light" onclick="theme.set('light')" title="Light">☀</button>
      <button data-theme-btn="dark" onclick="theme.set('dark')" title="Dark">🌙</button>
      <button data-theme-btn="high-contrast" onclick="theme.set('high-contrast')" title="High Contrast">◑</button>
    </div>
  </div>
</header>

<!-- MAIN LAYOUT -->
<main>
  <!-- SIDEBAR NAVIGATION -->
  <aside id="sidebar">
    <!-- Populated by JavaScript -->
  </aside>

  <!-- MAIN CONTENT -->
  <div id="main-content">
    <!-- Docs loaded here by router -->
  </div>
</main>

<!-- TOAST -->
<div id="toast"></div>

<!-- SCRIPTS -->
<script src="js/router.js"></script>
<script src="js/theme.js"></script>
<script src="js/code-copy.js"></script>

<script>
  /**
   * Initialize Design System Shell
   */
  document.addEventListener('DOMContentLoaded', () => {
    // Initialize theme
    theme.init();

    // Render navigation
    const sidebar = document.getElementById('sidebar');
    const navMap = router.getNav();
    
    // Build simplified sidebar with single item
    for (const [id, def] of Object.entries(navMap)) {
      const link = document.createElement('a');
      link.className = 'nav-item';
      link.href = `#${id}`;
      link.setAttribute('data-nav-item', id);
      link.onclick = (e) => {
        e.preventDefault();
        router.navigate(id);
      };
      
      const icon = document.createElement('span');
      icon.className = 'icon material-symbols-rounded';
      icon.textContent = def.icon;
      
      const label = document.createElement('span');
      label.textContent = def.label;
      
      link.appendChild(icon);
      link.appendChild(label);
      sidebar.appendChild(link);
    }

    // Initialize router and load initial page
    router.init();
  });

  /**
   * Make functions available for onclick handlers
   */
  window.setTheme = (t) => theme.set(t);
  window.switchTab = (btn, id) => codeCopy.switchTab(btn, id);
  window.copyCode = (btn) => codeCopy.copy(btn);
  window.copyToken = (text, label) => codeCopy.copyToken(text, label);
</script>

</body>
</html>
