<!-- QA Checklist Fragment -->
<div class="section-header">
  <h1>QA Checklist</h1>
  <p>Validación de componentes y estados</p>
</div>

<div class="qa-checklist">
  <div class="checklist-group">
    <h3>Temas</h3>
    <label class="checklist-item">
      <input type="checkbox">
      Light mode renderiza correctamente
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Dark mode renderiza correctamente
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      High contrast mode renderiza correctamente
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Tema persiste en localStorage
    </label>
  </div>

  <div class="checklist-group">
    <h3>Componentes Web</h3>
    <label class="checklist-item">
      <input type="checkbox">
      Botones (primary, secondary, ghost)
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Inputs (text, email, password, select)
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Alertas (success, danger, warning, info)
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Tarjetas (estándar, interactiva, flat)
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Tablas (básica, striped, hover)
    </label>
  </div>

  <div class="checklist-group">
    <h3>Accesibilidad</h3>
    <label class="checklist-item">
      <input type="checkbox">
      Focus visible en todos los componentes interactivos
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Contraste texto/fondo cumple WCAG AA
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Navegación por teclado (Tab, Enter, Esc)
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Screen reader compatible
    </label>
  </div>

  <div class="checklist-group">
    <h3>Responsivo</h3>
    <label class="checklist-item">
      <input type="checkbox">
      Mobile (< 480px)
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Tablet (480-768px)
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Desktop (> 768px)
    </label>
  </div>

  <div class="checklist-group">
    <h3>Cross-browser</h3>
    <label class="checklist-item">
      <input type="checkbox">
      Chrome/Chromium
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Firefox
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Safari
    </label>
    <label class="checklist-item">
      <input type="checkbox">
      Edge
    </label>
  </div>
</div>

<style>
.qa-checklist {
  display: grid;
  gap: var(--space-24);
  max-width: 600px;
}

.checklist-group {
  border-left: 4px solid var(--color-primary);
  padding-left: var(--space-16);
}

.checklist-group h3 {
  font-size: var(--font-size-lg);
  font-weight: 600;
  margin-bottom: var(--space-12);
  color: var(--color-text-primary);
}

.checklist-item {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  padding: var(--space-8) 0;
  cursor: pointer;
  user-select: none;
  color: var(--color-text-secondary);
  font-size: var(--font-size-sm);
}

.checklist-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--color-primary);
}

.checklist-item input[type="checkbox"]:checked + * {
  text-decoration: line-through;
  color: var(--color-text-muted);
}
</style>
