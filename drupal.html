<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <title>Compensar — Design System · Drupal / ZT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,400&family=Roboto+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet">
  <link rel="stylesheet" href="css/core.css?v=20260505-5">
  <link rel="stylesheet" href="css/portal.css?v=20260505-5">
  <link rel="stylesheet" href="icons/icons.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-brand">
      <a href="index.html" class="ds-back-link" title="Volver al portal">
        <i class="icon icon-arrow-left icon-20 ds-back-link__icon" aria-hidden="true"></i>
      </a>
      <div class="logo-mark">C</div>
      <span class="brand-name">Design System</span>
      <span class="brand-tag">Drupal · ZT</span>
    </div>
    <div class="header-right">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" id="searchInput" placeholder="Buscar tokens, componentes…">
      </div>
      <div class="theme-switcher">
        <button id="btn-light" onclick="setTheme('light')" class="active">☀ Claro</button>
        <button id="btn-dark" onclick="setTheme('dark')">🌙 Oscuro</button>
        <button id="btn-hc" onclick="setTheme('high-contrast')">◑ Alto contraste</button>
      </div>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR — generado dinámicamente por ds-bundle.js buildSidebar() -->
    <nav class="sidebar" id="drupal-sidebar"></nav>

    <!-- CONTENIDO -->
    <main class="main">
      <div id="content">
        <div class="fragment-loading">
          <div class="fragment-loading-spinner"></div>
          <span class="fragment-loading-text">Cargando…</span>
        </div>
      </div>
    </main>

  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>


  <!-- SCRIPTS -->
  <script>window.DS_PLATFORM = 'drupal';</script>
  <script src="js/ds-bundle.js?v=20260505-6"></script>
  <script src="js/component-docs.js?v=20260505-3"></script>
  <script src="js/selection-docs.js?v=20260505-3"></script>
  <script src="js/alert-docs.js?v=20260505-3"></script>
  <script src="js/toast-docs.js?v=20260505-3"></script>
<script src="js/modal-docs.js?v=20260504-13"></script>
<script src="js/dropdown-docs.js?v=20260504-5"></script>
<script src="js/badges-docs.js?v=20260505-1"></script>
<script src="js/cards-docs.js?v=20260505-2"></script>
<script src="js/tabs-docs.js?v=20260505-1"></script>

</body>

</html>
